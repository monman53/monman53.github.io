<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width">
  <meta charset="utf-8">
  <link rel="icon" href="/images/favicon.png">
  <link href="/styles/main.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">

  <!-- highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/vs2015.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>

  <!-- MathJax -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      }
    };
  </script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E9ZG1KHTVT"></script>
  <script src='/scripts/google.js'></script>

  <title>{{ title }} : monman53</title>
</head>

<body>
  <header>
    <div class="pad">
      <div class="flex-row">
        <div class="flex-fill">
          <span>
            <a href="/"><i class="bi bi-house-door-fill"></i></a>
            {{ bread }}
          </span>
        </div>
        <div class="flex-fill-end">
          <span><a href="https://github.com/monman53/monman53.github.io"><i class="bi bi-github"></i></a></span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="pad">
      <article>
        {{ contents }}
      </article>
    </div>
  </main>

  <footer>
    <div class="pad">
      <div class="flex-row">
        <div class="flex-fill">
          <span>Last modified: {{ last_modified }}</span>
          <br>
          <span><a href="/">monman53.github.io</a></span>
          |
          <span><a href="/sitemap.html">sitemap</a></span>
        </div>
        <div class="flex-fill-end">
          <span><a href="https://github.com/monman53/monman53.github.io"><i class="bi bi-github"></i></a></span>
        </div>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('article');
      const imgs = container.querySelectorAll('img');

      for (const img of imgs) {
        const figure = document.createElement('figure');
        const new_img = document.createElement('img');
        const figcaption = document.createElement('figcaption');
        new_img.src = img.src;
        new_img.alt = img.alt;
        figcaption.innerText = img.alt;

        figure.appendChild(new_img);
        if (img.alt !== "") {
          figure.appendChild(figcaption);
        }

        img.replaceWith(figure);
      }
    });
  </script>

  <script>hljs.highlightAll();</script>
</body>

</html>
